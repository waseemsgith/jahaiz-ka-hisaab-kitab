# Primary Blueprint (repo root — Render discovers this path by default).
# Python version is pinned by backend/Dockerfile (3.11.11-slim).
services:
  - type: web
    name: jahaiz-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: DEBUG
        value: "false"
    healthCheckPath: /health
    autoDeploy: true
