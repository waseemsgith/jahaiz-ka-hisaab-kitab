# Render Blueprint — Docker-based Python 3.11 backend.
# Render discovers this file at the repo root automatically.
services:
  - type: web
    name: jahaiz-backend
    runtime: docker
    # rootDir tells Render where the build context root is.
    # dockerfilePath is relative to the REPO root.
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: GEMINI_API_KEY
        sync: false          # set manually in Render dashboard → "Secret"
      - key: DEBUG
        value: "false"
      - key: PORT
        value: "8000"       # Render injects this; uvicorn reads ${PORT:-8000}
    healthCheckPath: /health
    autoDeploy: true
